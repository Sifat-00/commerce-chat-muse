<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aria Chat Widget — embed demo</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      code {
        background: #eef2ff;
        padding: 2px 6px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div style="text-align: center; max-width: 34rem; padding: 1.5rem">
      <h1>Embed demo</h1>
      <p>
        This plain HTML page loads the widget with a single
        <code>&lt;script src="/embed/aria-chat-widget.js" defer&gt;&lt;/script&gt;</code> tag. The
        bubble in the bottom-right corner is the whole widget.
      </p>
    </div>

    <!-- One-line embed -->
    <script src="/embed/aria-chat-widget.js" defer></script>
  </body>
</html>
